<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <h1 id="title">Consumer Survey</h1>
  <p id="description">This is a survey on out new product.</p>
  <body>
    <form id="survey-form">
      <label id="name-label">Name:<input id="name" placeholder="Your name" required/></label>
      <label id="email-label">Email:<input type="email" id="email" required placeholder="Your email"/></label>
      <label id="number-label">Age:<input id="number" type="number" min="13" max="120" placeholder="Your age"/></label>
      <select id="dropdown">
        <option>Yes</option>
        <option>No</option>
        </select>
        </label>
        <label> Would you recommend this site to someone else?
        <input type="radio" value="1" name="recommended">Yes
        <input type="radio" value="2" name="recommended">No
        </label>
        <label> What could we do to improve?

          <input type="checkbox" value="1">Design
          <input type="checkbox" value="2">Projects
          </label>
          <textarea
          placeholder="One thing you could do..."></textarea>
          <button id="submit" type="submit">
      </form>
  </body>
</html>
